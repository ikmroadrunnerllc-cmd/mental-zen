<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Device Outer Frame -->
  <rect x="0" y="0" width="390" height="844" rx="40" fill="#f8f9fa" stroke="#212529" stroke-width="4"/>
  <!-- Status Bar -->
  <rect x="135" y="12" width="120" height="28" rx="14" fill="#212529"/>
  <text x="35" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#212529">09:41</text>
  <text x="330" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#212529">100%</text>

  <!-- App Bar -->
  <text x="30" y="85" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212529">Daily Insights</text>
  <text x="30" y="105" font-family="sans-serif" font-size="12" fill="#6c757d">Synthesized from your last 14 days</text>

  <!-- Featured AI Insight Card -->
  <g transform="translate(30, 125)">
    <rect x="0" y="0" width="330" height="225" rx="14" fill="#ffffff" stroke="#212529" stroke-width="2"/>
    
    <!-- Card Header with Confidence Badge -->
    <text x="18" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#212529">Today's Pattern</text>
    <rect x="200" y="15" width="112" height="24" rx="12" fill="#e9ecef" stroke="#adb5bd" stroke-width="1"/>
    <text x="256" y="31" font-family="sans-serif" font-size="11" font-weight="bold" fill="#212529" text-anchor="middle">High Confidence</text>
    
    <!-- Insight Text (<= 160 chars) -->
    <text x="18" y="70" font-family="sans-serif" font-size="14" fill="#212529">Your mood correlates strongly with</text>
    <text x="18" y="92" font-family="sans-serif" font-size="14" fill="#212529">completing academic tasks early and</text>
    <text x="18" y="114" font-family="sans-serif" font-size="14" fill="#212529">spending time outdoors in the evening.</text>
    <text x="18" y="136" font-family="sans-serif" font-size="14" fill="#212529">Keep maintaining your morning walks.</text>

    <line x1="18" y1="160" x2="312" y2="160" stroke="#dee2e6" stroke-width="1"/>

    <!-- Topic Pills -->
    <text x="18" y="184" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6c757d">Key Drivers:</text>
    <rect x="18" y="193" width="70" height="20" rx="10" fill="#e9ecef"/>
    <text x="53" y="207" font-family="sans-serif" font-size="10" fill="#495057" text-anchor="middle">academics</text>
    <rect x="94" y="193" width="60" height="20" rx="10" fill="#e9ecef"/>
    <text x="124" y="207" font-family="sans-serif" font-size="10" fill="#495057" text-anchor="middle">routine</text>
    <rect x="160" y="193" width="70" height="20" rx="10" fill="#e9ecef"/>
    <text x="195" y="207" font-family="sans-serif" font-size="10" fill="#495057" text-anchor="middle">exercise</text>
  </g>

  <!-- 14-Day Mood Trend Chart Card -->
  <g transform="translate(30, 370)">
    <rect x="0" y="0" width="330" height="230" rx="14" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
    <text x="18" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#212529">14-Day Mood Trend</text>
    <text x="18" y="50" font-family="sans-serif" font-size="11" fill="#6c757d">Average rating: 3.8 / 5.0</text>

    <!-- Bar Chart Representation (14 bars) -->
    <g transform="translate(18, 70)">
      <!-- Y-Axis indicators -->
      <line x1="0" y1="0" x2="294" y2="0" stroke="#f1f3f5" stroke-width="1"/>
      <line x1="0" y1="50" x2="294" y2="50" stroke="#f1f3f5" stroke-width="1"/>
      <line x1="0" y1="100" x2="294" y2="100" stroke="#ced4da" stroke-width="1"/>

      <!-- Bars -->
      <rect x="5" y="40" width="14" height="60" rx="3" fill="#adb5bd"/>
      <rect x="26" y="20" width="14" height="80" rx="3" fill="#495057"/>
      <rect x="47" y="50" width="14" height="50" rx="3" fill="#ced4da"/>
      <rect x="68" y="10" width="14" height="90" rx="3" fill="#212529"/>
      <rect x="89" y="30" width="14" height="70" rx="3" fill="#495057"/>
      <rect x="110" y="60" width="14" height="40" rx="3" fill="#ced4da"/>
      <rect x="131" y="20" width="14" height="80" rx="3" fill="#495057"/>
      <rect x="152" y="20" width="14" height="80" rx="3" fill="#495057"/>
      <rect x="173" y="10" width="14" height="90" rx="3" fill="#212529"/>
      <rect x="194" y="40" width="14" height="60" rx="3" fill="#adb5bd"/>
      <rect x="215" y="30" width="14" height="70" rx="3" fill="#495057"/>
      <rect x="236" y="20" width="14" height="80" rx="3" fill="#495057"/>
      <rect x="257" y="10" width="14" height="90" rx="3" fill="#212529"/>
      <rect x="278" y="20" width="14" height="80" rx="3" fill="#212529"/>
    </g>
    <text x="24" y="195" font-family="sans-serif" font-size="10" fill="#adb5bd">Day 1</text>
    <text x="306" y="195" font-family="sans-serif" font-size="10" fill="#adb5bd" text-anchor="end">Today</text>
    <text x="18" y="215" font-family="sans-serif" font-size="10" fill="#6c757d">Stable positive trend over past 7 days</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <rect x="0" y="750" width="390" height="65" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="65" y="785" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">Today</text>
  <text x="165" y="785" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">History</text>
  <rect x="235" y="758" width="40" height="4" rx="2" fill="#212529"/>
  <text x="255" y="785" font-family="sans-serif" font-size="11" font-weight="bold" fill="#212529" text-anchor="middle">Insights</text>
  <text x="335" y="785" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">Settings</text>

  <!-- Home Indicator -->
  <rect x="130" y="825" width="130" height="5" rx="2.5" fill="#212529"/>
</svg>
