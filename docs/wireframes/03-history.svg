<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Device Outer Frame -->
  <rect x="0" y="0" width="390" height="844" rx="40" fill="#f8f9fa" stroke="#212529" stroke-width="4"/>
  <!-- Status Bar -->
  <rect x="135" y="12" width="120" height="28" rx="14" fill="#212529"/>
  <text x="35" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#212529">09:41</text>
  <text x="330" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#212529">100%</text>

  <!-- App Bar -->
  <text x="30" y="85" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212529">Journal History</text>
  <text x="30" y="105" font-family="sans-serif" font-size="12" fill="#6c757d">24 total entries recorded</text>

  <!-- Filter Chips Row -->
  <rect x="30" y="125" width="55" height="30" rx="15" fill="#212529"/>
  <text x="57" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">All</text>

  <rect x="95" y="125" width="55" height="30" rx="15" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
  <text x="122" y="145" font-family="sans-serif" font-size="11" fill="#495057" text-anchor="middle">Mood 5</text>

  <rect x="160" y="125" width="55" height="30" rx="15" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
  <text x="187" y="145" font-family="sans-serif" font-size="11" fill="#495057" text-anchor="middle">Mood 4</text>

  <rect x="225" y="125" width="55" height="30" rx="15" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
  <text x="252" y="145" font-family="sans-serif" font-size="11" fill="#495057" text-anchor="middle">Mood 3</text>

  <rect x="290" y="125" width="70" height="30" rx="15" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
  <text x="325" y="145" font-family="sans-serif" font-size="11" fill="#495057" text-anchor="middle">Mood 1-2</text>

  <!-- Entry Card 1 (Nov 19) -->
  <g transform="translate(30, 175)">
    <rect x="0" y="0" width="330" height="110" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
    <!-- Mood Badge -->
    <rect x="15" y="15" width="60" height="24" rx="12" fill="#212529"/>
    <text x="45" y="31" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Mood 4</text>
    <text x="85" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#212529">Yesterday, 9:15 PM</text>
    <text x="15" y="60" font-family="sans-serif" font-size="13" fill="#495057">Finished my group presentation draft on time.</text>
    <text x="15" y="78" font-family="sans-serif" font-size="13" fill="#495057">Went for an evening walk and felt very relaxed...</text>
    <text x="15" y="98" font-family="sans-serif" font-size="10" fill="#adb5bd">Sentiment: +0.72 • 2 topics</text>
  </g>

  <!-- Entry Card 2 (Nov 18) -->
  <g transform="translate(30, 300)">
    <rect x="0" y="0" width="330" height="110" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
    <rect x="15" y="15" width="60" height="24" rx="12" fill="#495057"/>
    <text x="45" y="31" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Mood 3</text>
    <text x="85" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#212529">Tuesday, Nov 18</text>
    <text x="15" y="60" font-family="sans-serif" font-size="13" fill="#495057">Long day in the computer science lab. Lots of</text>
    <text x="15" y="78" font-family="sans-serif" font-size="13" fill="#495057">errors encountered, but made steady progress...</text>
    <text x="15" y="98" font-family="sans-serif" font-size="10" fill="#adb5bd">Sentiment: +0.05 • 1 topic</text>
  </g>

  <!-- Entry Card 3 (Nov 17) -->
  <g transform="translate(30, 425)">
    <rect x="0" y="0" width="330" height="110" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
    <rect x="15" y="15" width="60" height="24" rx="12" fill="#adb5bd"/>
    <text x="45" y="31" font-family="sans-serif" font-size="11" font-weight="bold" fill="#212529" text-anchor="middle">Mood 2</text>
    <text x="85" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#212529">Monday, Nov 17</text>
    <text x="15" y="60" font-family="sans-serif" font-size="13" fill="#495057">Felt overwhelmed by deadlines and lacked focus.</text>
    <text x="15" y="78" font-family="sans-serif" font-size="13" fill="#495057">Took an early night to reset my sleep cycle...</text>
    <text x="15" y="98" font-family="sans-serif" font-size="10" fill="#adb5bd">Sentiment: -0.45 • 3 topics</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <rect x="0" y="750" width="390" height="65" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="65" y="785" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">Today</text>
  <rect x="145" y="758" width="40" height="4" rx="2" fill="#212529"/>
  <text x="165" y="785" font-family="sans-serif" font-size="11" font-weight="bold" fill="#212529" text-anchor="middle">History</text>
  <text x="255" y="785" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">Insights</text>
  <text x="335" y="785" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">Settings</text>

  <!-- Home Indicator -->
  <rect x="130" y="825" width="130" height="5" rx="2.5" fill="#212529"/>
