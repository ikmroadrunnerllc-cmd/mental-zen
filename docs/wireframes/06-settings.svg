<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Device Outer Frame -->
  <rect x="0" y="0" width="390" height="844" rx="40" fill="#f8f9fa" stroke="#212529" stroke-width="4"/>
  <!-- Status Bar -->
  <rect x="135" y="12" width="120" height="28" rx="14" fill="#212529"/>
  <text x="35" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#212529">09:41</text>
  <text x="330" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#212529">100%</text>

  <!-- App Bar -->
  <text x="30" y="85" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212529">Settings</text>

  <!-- User Profile Summary Card -->
  <g transform="translate(30, 110)">
    <rect x="0" y="0" width="330" height="70" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="22" fill="#e9ecef" stroke="#adb5bd" stroke-width="1"/>
    <text x="35" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#495057" text-anchor="middle">MZ</text>
    <text x="70" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#212529">student@university.edu</text>
    <text x="70" y="50" font-family="sans-serif" font-size="12" fill="#6c757d">Free Tier • Android Device</text>
  </g>

  <!-- Preferences Section -->
  <text x="30" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6c757d">PREFERENCES & PRIVACY</text>
  <g transform="translate(30, 220)">
    <rect x="0" y="0" width="330" height="130" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
    
    <!-- Row 1: AI Insights Toggle -->
    <text x="15" y="32" font-family="sans-serif" font-size="13" font-weight="bold" fill="#212529">AI Daily Insights</text>
    <text x="15" y="50" font-family="sans-serif" font-size="11" fill="#6c757d">Allow cloud model to synthesize patterns</text>
    <!-- Switch (ON) -->
    <rect x="265" y="22" width="50" height="28" rx="14" fill="#212529"/>
    <circle cx="299" cy="36" r="11" fill="#ffffff"/>

    <line x1="15" y1="65" x2="315" y2="65" stroke="#dee2e6" stroke-width="1"/>

    <!-- Row 2: Daily Reminder -->
    <text x="15" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#212529">Daily Journal Reminder</text>
    <text x="15" y="110" font-family="sans-serif" font-size="11" fill="#6c757d">Notification at 20:00</text>
    <!-- Switch (ON) -->
    <rect x="265" y="82" width="50" height="28" rx="14" fill="#212529"/>
    <circle cx="299" cy="96" r="11" fill="#ffffff"/>
  </g>

  <!-- Data Management Section -->
  <text x="30" y="380" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6c757d">DATA MANAGEMENT</text>
  <g transform="translate(30, 390)">
    <rect x="0" y="0" width="330" height="110" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
    
    <!-- Export Data Button -->
    <text x="15" y="33" font-family="sans-serif" font-size="13" font-weight="bold" fill="#212529">Export Journal Data</text>
    <text x="15" y="50" font-family="sans-serif" font-size="11" fill="#6c757d">Download all entries as JSON</text>
    <rect x="245" y="18" width="70" height="32" rx="6" fill="#e9ecef" stroke="#ced4da" stroke-width="1"/>
    <text x="280" y="38" font-family="sans-serif" font-size="11" font-weight="bold" fill="#212529" text-anchor="middle">Export</text>

    <line x1="15" y1="62" x2="315" y2="62" stroke="#dee2e6" stroke-width="1"/>

    <!-- Sign Out Button -->
    <text x="15" y="88" font-family="sans-serif" font-size="13" font-weight="bold" fill="#212529">Sign Out</text>
    <text x="300" y="88" font-family="sans-serif" font-size="14" fill="#adb5bd">→</text>
  </g>

  <!-- Danger Zone -->
  <text x="30" y="530" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6c757d">DANGER ZONE</text>
  <g transform="translate(30, 540)">
    <rect x="0" y="0" width="330" height="60" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
    <text x="15" y="32" font-family="sans-serif" font-size="13" font-weight="bold" fill="#495057">Delete Account &amp; Data</text>
    <rect x="235" y="14" width="80" height="32" rx="6" fill="#212529"/>
    <text x="275" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Delete</text>
  </g>

  <!-- Version Info -->
  <text x="195" y="725" font-family="sans-serif" font-size="11" fill="#adb5bd" text-anchor="middle">Mental Zen v1.0.0 (Build 1)</text>

  <!-- Bottom Navigation Bar -->
  <rect x="0" y="750" width="390" height="65" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="65" y="785" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">Today</text>
  <text x="165" y="785" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">History</text>
  <text x="255" y="785" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">Insights</text>
  <rect x="315" y="758" width="40" height="4" rx="2" fill="#212529"/>
  <text x="335" y="785" font-family="sans-serif" font-size="11" font-weight="bold" fill="#212529" text-anchor="middle">Settings</text>

  <!-- Home Indicator -->
  <rect x="130" y="825" width="130" height="5" rx="2.5" fill="#212529"/>
</svg>
