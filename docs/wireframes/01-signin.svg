<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Device Outer Frame -->
  <rect x="0" y="0" width="390" height="844" rx="40" fill="#f8f9fa" stroke="#212529" stroke-width="4"/>
  <!-- Status Bar / Dynamic Island -->
  <rect x="135" y="12" width="120" height="28" rx="14" fill="#212529"/>
  <text x="35" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#212529">09:41</text>
  <text x="330" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#212529">100%</text>

  <!-- App Header / Logo Placeholder -->
  <rect x="145" y="120" width="100" height="100" rx="16" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
  <text x="195" y="175" font-family="sans-serif" font-size="14" fill="#495057" text-anchor="middle">LOGO</text>
  
  <text x="195" y="255" font-family="sans-serif" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">Mental Zen</text>
  <text x="195" y="280" font-family="sans-serif" font-size="13" fill="#6c757d" text-anchor="middle">Private Daily Mood Journal</text>

  <!-- Form Fields -->
  <!-- Email Input -->
  <text x="40" y="340" font-family="sans-serif" font-size="12" font-weight="bold" fill="#495057">Email</text>
  <rect x="40" y="350" width="310" height="48" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
  <text x="56" y="380" font-family="sans-serif" font-size="14" fill="#6c757d">user@example.com</text>

  <!-- Password Input -->
  <text x="40" y="425" font-family="sans-serif" font-size="12" font-weight="bold" fill="#495057">Password</text>
  <rect x="40" y="435" width="310" height="48" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
  <text x="56" y="465" font-family="sans-serif" font-size="14" fill="#6c757d">••••••••••••</text>

  <!-- Sign In Button -->
  <rect x="40" y="515" width="310" height="48" rx="8" fill="#212529"/>
  <text x="195" y="545" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Sign In</text>

  <!-- Divider -->
  <line x1="40" y1="595" x2="160" y2="595" stroke="#dee2e6" stroke-width="1"/>
  <text x="195" y="599" font-family="sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">OR</text>
  <line x1="230" y1="595" x2="350" y2="595" stroke="#dee2e6" stroke-width="1"/>

  <!-- Google Sign-in Button -->
  <rect x="40" y="625" width="310" height="48" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
  <text x="195" y="655" font-family="sans-serif" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">Continue with Google</text>

  <!-- Footer Link -->
  <text x="195" y="730" font-family="sans-serif" font-size="13" fill="#6c757d" text-anchor="middle">Don't have an account? <tspan font-weight="bold" fill="#212529">Sign Up</tspan></text>

  <!-- Home Indicator -->
  <rect x="130" y="825" width="130" height="5" rx="2.5" fill="#212529"/>
</svg>
